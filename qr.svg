<rect x="0" y="0" width="300" height="300" fill="#fff"/>
<rect x="25" y="25" width="70" height="70" fill="#111"/><rect x="35" y="35" width="50" height="50" fill="#fff"/><rect x="45" y="45" width="30" height="30" fill="#111"/>
