.d{fill:none;stroke:#111;stroke-width:1.2;stroke-dasharray:4 5;stroke-linecap:round;stroke-linejoin:round}
.m{fill:none;stroke:#111;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.f{fill:#111;stroke:none}
.lbl{fill:#111;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700}
